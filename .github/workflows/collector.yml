# GitHub Actions schedule for the Roblox Trend Database collector.
# Lives at .github/workflows/collector.yml in the repository.
# Times are UTC. GitHub runs schedules approximately (often 5–15 minutes late), which is fine here.

name: rtdb collector

on:
  schedule:
    - cron: "*/30 * * * *"   # stats, every 30 minutes
    - cron: "7 * * * *"      # sorts + promote, hourly
    - cron: "20 3 * * *"     # daily refresh
    - cron: "40 4 * * 1"     # weekly feature coding (auto traits, then the LLM pass if a key is set)
    - cron: "0 14 * * *"     # daily explosive radar (07:00 Pacific); briefs committed to reports/
    - cron: "30 15 * * 1"    # weekly opportunity engine (Mondays, after the radar); 3 briefs committed to reports/
    - cron: "0 2 * * 0"      # weekly backup → release "backups" (encrypted when BACKUP_PASSPHRASE is set)
    - cron: "30 2 1 * *"     # monthly archive of last month's snapshot + chart_position rows
    - cron: "0 12 * * 0"     # weekly heartbeat commit (keeps the schedule from being paused)
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run by hand"
        type: choice
        default: stats
        options: [stats, sorts, promote, daily, sample-controls, probe, passes, platform-ccu, code-auto, code-llm, radar, opportunity, backup, archive-month, purge-public-reports]

permissions:
  contents: write            # only used by the heartbeat commit

# Never stack two copies of the same schedule; different schedules may overlap (they run on different machines).
concurrency:
  group: rtdb-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RTDB_CONTACT: ${{ secrets.RTDB_CONTACT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RTDB_DISCORD_WEBHOOK: ${{ secrets.RTDB_DISCORD_WEBHOOK }}
      REPORTS_REPO: ${{ secrets.REPORTS_REPO }}
      REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: github.event.schedule != '0 12 * * 0'
        run: pip install -r requirements.txt

      - name: stats (every 30 min)
        if: github.event.schedule == '*/30 * * * *' || inputs.job == 'stats'
        run: python collector.py stats

      - name: sorts + promote (hourly)
        if: github.event.schedule == '7 * * * *' || inputs.job == 'sorts'
        run: |
          python collector.py sorts
          python collector.py promote

      - name: daily refresh
        if: github.event.schedule == '20 3 * * *' || inputs.job == 'daily'
        run: python collector.py daily

      - name: other manual jobs
        if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["promote","sample-controls","probe","passes","platform-ccu"]'), inputs.job)
        run: python collector.py ${{ inputs.job }}

      - name: weekly feature coding
        if: github.event.schedule == '40 4 * * 1' || inputs.job == 'code-auto' || inputs.job == 'code-llm'
        run: |
          python code_features.py auto
          if [ "${{ inputs.job }}" != "code-auto" ]; then python code_features.py llm --limit 300; fi

      - name: explosive radar
        if: github.event.schedule == '0 14 * * *' || inputs.job == 'radar'
        run: |
          set -e
          python radar.py run
          bash publish_reports.sh radar

      - name: opportunity engine
        if: github.event.schedule == '30 15 * * 1' || inputs.job == 'opportunity'
        run: |
          set -e
          python opportunity.py run --top 3
          bash publish_reports.sh opportunities

      - name: remove reports from this (public) repository
        if: inputs.job == 'purge-public-reports'
        run: |
          git config user.name "rtdb-bot"
          git config user.email "rtdb-bot@users.noreply.github.com"
          git rm -r --quiet --ignore-unmatch reports || true
          git commit -m "move reports to the private repository" || exit 0
          git push

      - name: backup / archive
        if: github.event.schedule == '0 2 * * 0' || github.event.schedule == '30 2 1 * *' || inputs.job == 'backup' || inputs.job == 'archive-month'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -e
          if [ "${{ github.event.schedule }}" = "30 2 1 * *" ] || [ "${{ inputs.job }}" = "archive-month" ]; then
            python archive.py monthly --out backup_out
          else
            python archive.py weekly --out backup_out
          fi
          gh release view backups >/dev/null 2>&1 || gh release create backups --title "rtdb backups" \
            --notes "Automated database exports (weekly state + permanent monthly archives). Encrypted with gpg when BACKUP_PASSPHRASE is set: gpg --decrypt FILE.gpg > FILE, then python archive.py restore FILE."
          for f in backup_out/*; do
            if [ -n "$BACKUP_PASSPHRASE" ]; then
              gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o "$f.gpg" "$f"
              f="$f.gpg"
            else
              echo "::warning::BACKUP_PASSPHRASE is not set — uploading unencrypted backups to a public release"
            fi
            gh release upload backups "$f" --clobber
          done

      - name: weekly heartbeat commit
        if: github.event.schedule == '0 12 * * 0'
        run: |
          git config user.name "rtdb-bot"
          git config user.email "rtdb-bot@users.noreply.github.com"
          date -u > heartbeat.txt
          git add heartbeat.txt
          git commit -m "heartbeat: keep the schedule active" || exit 0
          git push
