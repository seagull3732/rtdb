# GitHub Actions schedule for the Roblox Trend Database collector.
# Lives at .github/workflows/collector.yml in the repository.
# Times are UTC. GitHub runs schedules approximately (often 5–15 minutes late), which is fine here.

name: rtdb collector

on:
  schedule:
    - cron: "*/30 * * * *"   # stats, every 30 minutes
    - cron: "7 * * * *"      # sorts + promote, hourly
    - cron: "20 3 * * *"     # daily refresh
    - cron: "40 4 * * 1"     # weekly feature coding (auto traits, then the LLM pass if a key is set)
    - cron: "0 14 * * *"     # daily explosive radar (07:00 Pacific); briefs committed to reports/
    - cron: "30 15 * * 1"    # weekly opportunity engine (Mondays, after the radar); 3 briefs committed to reports/
    - cron: "0 16 * * 1"     # weekly game idea agent (Mondays, after the opportunities); concepts committed to reports/
    - cron: "0 2 * * 0"      # weekly backup → release "backups" (encrypted when BACKUP_PASSPHRASE is set)
    - cron: "30 2 1 * *"     # monthly archive of last month's snapshot + chart_position rows
    - cron: "0 12 * * 0"     # weekly heartbeat commit (keeps the schedule from being paused)
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run by hand"
        type: choice
        default: stats
        options: [stats, sorts, promote, daily, sample-controls, probe, passes, platform-ccu, code-auto, code-llm, radar, opportunity, ideas, backup, archive-month, purge-public-reports]

permissions:
  contents: write            # only used by the heartbeat commit

# Never stack two copies of the same schedule; different schedules may overlap (they run on different machines).
concurrency:
  group: rtdb-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RTDB_CONTACT: ${{ secrets.RTDB_CONTACT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RTDB_DISCORD_WEBHOOK: ${{ secrets.RTDB_DISCORD_WEBHOOK }}
      REPORTS_REPO: ${{ secrets.REPORTS_REPO }}
      REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
      # Cost knobs: set these under Settings → Secrets and variables → Actions → Variables (no file edits needed)
      RTDB_RADAR_N: ${{ vars.RTDB_RADAR_N || '12' }}                       # briefs per daily radar run
      RTDB_RADAR_MODEL: ${{ vars.RTDB_RADAR_MODEL || 'claude-sonnet-5-5' }} # e.g. claude-haiku-4-5-20251001 for ~1/3 the cost
      RTDB_OPP_TOP: ${{ vars.RTDB_OPP_TOP || '3' }}                         # briefs per weekly opportunity run
      RTDB_IDEAS_ARCHETYPES: ${{ vars.RTDB_IDEAS_ARCHETYPES || '3' }}       # archetypes the idea agent works on each week
      RTDB_IDEAS_PER: ${{ vars.RTDB_IDEAS_PER || '3' }}                     # concepts per archetype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: github.event.schedule != '0 12 * * 0'
        run: pip install -r requirements.txt

      - name: Write the report-publishing helper (self-contained; nothing to upload)
        run: |
          cat > ./publish_reports.sh <<'PUBLISH_EOF'
          #!/usr/bin/env bash
          # publish_reports.sh <label> — push everything in reports/ to the private reports repository when
          # REPORTS_REPO (owner/name) and REPORTS_TOKEN (fine-grained PAT, Contents: read/write) are set;
          # otherwise commit reports/ into this repository. Also maintains reports/README.md as an index.
          set -e
          LABEL="${1:-reports}"
          ls reports/*.md >/dev/null 2>&1 || { echo "no reports to publish"; exit 0; }

          make_index() {
          python3 - "$1" <<'PY'
          import os, sys, glob
          d = sys.argv[1]
          def section(title, pattern):
              files = sorted(glob.glob(os.path.join(d, pattern)), reverse=True)
              out = [f"## {title}", ""]
              out += [f"- [{os.path.basename(f)}]({os.path.basename(f)})" for f in files[:60]] or ["- none yet"]
              return out + [""]
          lines = ["# rtdb reports", "", "Newest first. Opportunity reports are design briefs for the best-scoring archetypes; radar reports are daily briefs on games that ignited.", ""]
          if os.path.exists(os.path.join(d, "concepts_log.md")):
              lines += ["**[Concepts log — every concept the idea agent has proposed, with status](concepts_log.md)**", ""]
          if os.path.exists(os.path.join(d, "ideas_log.md")):
              lines += ["**[Ideas log — every opportunity brief's idea, one line each](ideas_log.md)**", ""]
          lines += section("Concepts (idea agent)", "concepts-*.md") + section("Opportunities", "opportunities-*.md") + section("Radar", "radar-*.md")
          open(os.path.join(d, "README.md"), "w", encoding="utf-8").write("\n".join(lines))
          PY
          }

          git config user.name "rtdb-bot"
          git config user.email "rtdb-bot@users.noreply.github.com"

          if [ -n "$REPORTS_REPO" ] && [ -n "$REPORTS_TOKEN" ]; then
            rm -rf _reports
            git clone --quiet --depth 1 "https://x-access-token:${REPORTS_TOKEN}@github.com/${REPORTS_REPO}.git" _reports
            mkdir -p _reports/reports
            cp reports/*.md _reports/reports/
            make_index _reports/reports
            cd _reports
            git config user.name "rtdb-bot"
            git config user.email "rtdb-bot@users.noreply.github.com"
            git add reports
            git commit -m "${LABEL}: $(date -u +%F)" || { echo "nothing new"; exit 0; }
            git push --quiet
            echo "published to private repo ${REPORTS_REPO}"
          else
            make_index reports
            git add reports
            git commit -m "${LABEL}: $(date -u +%F)" || { echo "nothing new"; exit 0; }
            git pull --rebase --autostash origin main || true
            git push
            echo "committed to this repository (set REPORTS_REPO + REPORTS_TOKEN secrets to publish privately)"
          fi
          PUBLISH_EOF
          chmod +x ./publish_reports.sh

      - name: stats (every 30 min)
        if: github.event.schedule == '*/30 * * * *' || inputs.job == 'stats'
        run: python collector.py stats

      - name: sorts + promote (hourly)
        if: github.event.schedule == '7 * * * *' || inputs.job == 'sorts'
        run: |
          python collector.py sorts
          python collector.py promote

      - name: daily refresh
        if: github.event.schedule == '20 3 * * *' || inputs.job == 'daily'
        run: python collector.py daily

      - name: other manual jobs
        if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["promote","sample-controls","probe","passes","platform-ccu"]'), inputs.job)
        run: python collector.py ${{ inputs.job }}

      - name: weekly feature coding
        if: github.event.schedule == '40 4 * * 1' || inputs.job == 'code-auto' || inputs.job == 'code-llm'
        run: |
          python code_features.py auto
          if [ "${{ inputs.job }}" != "code-auto" ]; then python code_features.py llm --limit 300; fi

      - name: explosive radar
        if: github.event.schedule == '0 14 * * *' || inputs.job == 'radar'
        run: |
          set -e
          python radar.py run --n "$RTDB_RADAR_N" --model "$RTDB_RADAR_MODEL"
          bash ./publish_reports.sh radar

      - name: opportunity engine
        if: github.event.schedule == '30 15 * * 1' || inputs.job == 'opportunity'
        run: |
          set -e
          python opportunity.py run --top "$RTDB_OPP_TOP"
          bash ./publish_reports.sh opportunities

      - name: game idea agent
        if: github.event.schedule == '0 16 * * 1' || inputs.job == 'ideas'
        run: |
          set -e
          python ideas.py generate --archetypes "$RTDB_IDEAS_ARCHETYPES" --per "$RTDB_IDEAS_PER"
          bash ./publish_reports.sh concepts

      - name: remove reports from this (public) repository
        if: inputs.job == 'purge-public-reports'
        run: |
          git config user.name "rtdb-bot"
          git config user.email "rtdb-bot@users.noreply.github.com"
          git rm -r --quiet --ignore-unmatch reports || true
          git commit -m "move reports to the private repository" || exit 0
          git push

      - name: backup / archive
        if: github.event.schedule == '0 2 * * 0' || github.event.schedule == '30 2 1 * *' || inputs.job == 'backup' || inputs.job == 'archive-month'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -e
          if [ "${{ github.event.schedule }}" = "30 2 1 * *" ] || [ "${{ inputs.job }}" = "archive-month" ]; then
            python archive.py monthly --out backup_out
          else
            python archive.py weekly --out backup_out
          fi
          gh release view backups >/dev/null 2>&1 || gh release create backups --title "rtdb backups" \
            --notes "Automated database exports (weekly state + permanent monthly archives). Encrypted with gpg when BACKUP_PASSPHRASE is set: gpg --decrypt FILE.gpg > FILE, then python archive.py restore FILE."
          for f in backup_out/*; do
            if [ -n "$BACKUP_PASSPHRASE" ]; then
              gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o "$f.gpg" "$f"
              f="$f.gpg"
            else
              echo "::warning::BACKUP_PASSPHRASE is not set — uploading unencrypted backups to a public release"
            fi
            gh release upload backups "$f" --clobber
          done

      - name: weekly heartbeat commit
        if: github.event.schedule == '0 12 * * 0'
        run: |
          git config user.name "rtdb-bot"
          git config user.email "rtdb-bot@users.noreply.github.com"
          date -u > heartbeat.txt
          git add heartbeat.txt
          git commit -m "heartbeat: keep the schedule active" || exit 0
          git push
